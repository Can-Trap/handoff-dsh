# The receiving end of a handoff-dsh bundle, for DeepSeek Harness.
#
# One row: this bundle's Host plugin — handoff_inspect / handoff_import /
# handoff_brief. It re-reads the container itself (ZIP central directory and
# CRCs, or ustar/pax headers) instead of shelling out, so the verification does
# not share code with the writer.
#
# This bundle deliberately does NOT ship the Open Design MCP client row. A
# handoff can also be read LIVE over MCP, but the endpoint is machine-specific:
# `od mcp` refuses to start without either `OD_SIDECAR_CLIENT_ENDPOINT` (a named
# pipe carrying a per-install GUID) or `--daemon-url` (a port that changes every
# launch), so there is no portable value to commit. And `serverName` must be
# unique across live mcp-client instances, so two bundles shipping an
# `opendesign` row collide — which is what this one and sync-dsh both did.
#
# The row therefore belongs to the PROFILE patch, which is local and never
# published. See sync-dsh's cordis.patch.yml for the ready-to-paste snippet; the
# values are the same. Its tools then appear as mcp__opendesign__*, and the MCP
# form of the handoff prompt (scripts/hdd-prompt.js) names `od mcp` for exactly
# that server.
- insert:
    - id: handoff-tools
      name: '@local/dsh-handoff'
